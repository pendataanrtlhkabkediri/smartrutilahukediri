<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekap Konfirmasi - SMART RUTILAHU</title>
<link rel="stylesheet" href="bootstrap.min.css">
<style>
  :root{
    --primary:#2563eb;
    --primary-dark:#1e3a8a;
    --bg:#f8fafc;
    --card-bg:#ffffff;
    --text:#1e293b;
    --muted:#64748b;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .container-app{
    max-width:900px;
    margin:0 auto;
    padding:0 16px 60px;
  }
  header.top{
    background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 60%,#0ea5e9 100%);
    color:#fff;
    padding:28px 16px 24px;
    border-radius:0 0 24px 24px;
    margin-bottom:22px;
  }
  header.top .container-app{ padding-bottom:0; }
  header.top h1{
    font-size:1.3rem;
    font-weight:800;
    margin:0 0 4px;
  }
  header.top p{
    margin:0;
    font-size:.85rem;
    color:rgba(255,255,255,.85);
  }
  header.top a.back-link{
    color:#fff;
    text-decoration:none;
    font-size:.82rem;
    opacity:.9;
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-bottom:10px;
  }
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:18px;
  }
  .toolbar input[type=text]{
    flex:1 1 200px;
    height:44px;
    border-radius:12px;
    border:1.5px solid #dbe2ef;
    padding:0 14px;
    font-size:.9rem;
  }
  .btn-tool{
    height:44px;
    border-radius:12px;
    border:1.5px solid #dbe2ef;
    background:#fff;
    color:var(--text);
    font-size:.85rem;
    font-weight:600;
    padding:0 16px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-tool:hover{ background:#f1f5f9; }
  .btn-tool.danger{
    color:#dc2626;
    border-color:#fecaca;
  }
  .btn-tool.danger:hover{ background:#fef2f2; }
  .stats-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:18px;
  }
  .stat-card{
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:0 4px 14px rgba(15,23,42,.06);
    padding:16px;
    text-align:center;
  }
  .stat-card .num{
    font-size:1.6rem;
    font-weight:800;
    color:var(--primary-dark);
  }
  .stat-card .label{
    font-size:.78rem;
    color:var(--muted);
  }
  .table-wrap{
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:0 4px 14px rgba(15,23,42,.06);
    overflow:hidden;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:.86rem;
  }
  thead th{
    background:#f1f5f9;
    text-align:left;
    padding:12px 14px;
    font-size:.74rem;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
    white-space:nowrap;
    cursor:pointer;
    user-select:none;
  }
  thead th:hover{ color:var(--primary); }
  tbody td{
    padding:12px 14px;
    border-top:1px solid #eef2f7;
    vertical-align:top;
  }
  tbody tr:hover{ background:#f8fafc; }
  .badge-count{
    display:inline-block;
    background:#e0e7ff;
    color:var(--primary-dark);
    font-weight:700;
    padding:2px 10px;
    border-radius:999px;
    font-size:.78rem;
  }
  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
  }
  .empty-state .icon{ font-size:2.4rem; margin-bottom:10px; }
  .table-scroll{
    overflow-x:auto;
  }
  @media (max-width:480px){
    .stats-row{ grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="container-app">
    <a href="index.html" class="back-link">&larr; Kembali ke Halaman Utama</a>
    <h1>Rekap Konfirmasi Pendaftaran</h1>
    <p id="sourceInfo">Memuat data...</p>
  </div>
</header>

<div class="container-app">

  <div class="stats-row">
    <div class="stat-card">
      <div class="num" id="statTotalDesa">0</div>
      <div class="label">Desa Terkonfirmasi</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statTotalKirim">0</div>
      <div class="label">Total Pengiriman</div>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="Cari Kecamatan / Desa...">
    <button class="btn-tool" id="btnRefresh">🔄 Muat Ulang</button>
    <button class="btn-tool" id="btnExportCSV">⬇️ Export CSV</button>
    <button class="btn-tool" id="btnExportJSON">⬇️ Export JSON</button>
  </div>

  <div class="table-wrap">
    <div class="table-scroll">
      <table id="dataTable">
        <thead>
          <tr>
            <th data-sort="kecamatanLabel">Kecamatan</th>
            <th data-sort="desaLabel">Desa</th>
            <th data-sort="lastSentAt">Terakhir Kirim</th>
            <th data-sort="count">Jumlah</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="empty-state" id="emptyState" hidden>
      <div class="icon">📭</div>
      <span id="emptyText">Belum ada data konfirmasi.</span>
    </div>
  </div>

</div>

<script src="rutilahu-config.js"></script>
<script src="rutilahu-sheet-api.js"></script>
<script>
(function(){
  "use strict";

  var tableBody = document.getElementById("tableBody");
  var emptyState = document.getElementById("emptyState");
  var emptyText = document.getElementById("emptyText");
  var searchBox = document.getElementById("searchBox");
  var statTotalDesa = document.getElementById("statTotalDesa");
  var statTotalKirim = document.getElementById("statTotalKirim");
  var sourceInfo = document.getElementById("sourceInfo");

  var sortField = "lastSentAt";
  var sortDir = -1;
  var currentRows = [];

  function formatDate(iso){
    if (!iso) return "-";
    var d = new Date(iso);
    return d.toLocaleString("id-ID", {
      day: "2-digit", month: "short", year: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  function toCSV(rows){
    var lines = ["Kecamatan,Desa,Pertama Kirim,Terakhir Kirim,Jumlah Kirim"];
    rows.forEach(function(r){
      lines.push(['"' + r.kecamatanLabel + '"', '"' + r.desaLabel + '"', r.firstSentAt, r.lastSentAt, r.count].join(","));
    });
    return lines.join("\n");
  }

  function loadData(){
    sourceInfo.textContent = "Memuat data...";
    if (!SHEET_API_URL) {
      sourceInfo.textContent = "⚠️ SHEET_API_URL belum diisi di rutilahu-config.js.";
      emptyText.textContent = "Konfigurasi belum lengkap, belum ada data yang bisa ditampilkan.";
      return Promise.resolve([]);
    }
    return RutilahuAPI.fetchAll(SHEET_API_URL).then(function(rows){
      sourceInfo.textContent = "Data terpusat dari Google Sheet · " + rows.length + " desa tercatat.";
      emptyText.textContent = "Belum ada data konfirmasi.";
      return rows;
    }).catch(function(err){
      console.warn("Gagal memuat data pusat:", err);
      sourceInfo.textContent = "⚠️ Gagal memuat rekap pusat (" + err.message + "). Coba muat ulang.";
      emptyText.textContent = "Data tidak bisa dimuat.";
      return [];
    });
  }

  function render(){
    var query = searchBox.value.trim().toLowerCase();
    var rows = currentRows.filter(function(r){
      if (!query) return true;
      return (r.kecamatanLabel + " " + r.desaLabel).toLowerCase().indexOf(query) !== -1;
    });

    rows.sort(function(a,b){
      var av = a[sortField], bv = b[sortField];
      if (sortField === "lastSentAt") { av = new Date(av); bv = new Date(bv); }
      if (av < bv) return -1 * sortDir;
      if (av > bv) return 1 * sortDir;
      return 0;
    });

    statTotalDesa.textContent = currentRows.length;
    statTotalKirim.textContent = currentRows.reduce(function(sum, r){ return sum + (Number(r.count) || 0); }, 0);

    tableBody.innerHTML = "";
    if (rows.length === 0) {
      emptyState.hidden = false;
      return;
    }
    emptyState.hidden = true;

    rows.forEach(function(r){
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + r.kecamatanLabel + "</td>" +
        "<td>" + r.desaLabel + "</td>" +
        "<td>" + formatDate(r.lastSentAt) + "</td>" +
        "<td><span class=\"badge-count\">" + r.count + "x</span></td>";
      tableBody.appendChild(tr);
    });
  }

  function refresh(){
    loadData().then(function(rows){
      currentRows = rows;
      render();
    });
  }

  document.querySelectorAll("th[data-sort]").forEach(function(th){
    th.addEventListener("click", function(){
      var field = th.getAttribute("data-sort");
      if (sortField === field) {
        sortDir *= -1;
      } else {
        sortField = field;
        sortDir = 1;
      }
      render();
    });
  });

  searchBox.addEventListener("input", render);
  document.getElementById("btnRefresh").addEventListener("click", refresh);

  document.getElementById("btnExportCSV").addEventListener("click", function(){
    downloadFile("rekap-rutilahu.csv", toCSV(currentRows), "text/csv");
  });

  document.getElementById("btnExportJSON").addEventListener("click", function(){
    downloadFile("rekap-rutilahu.json", JSON.stringify(currentRows, null, 2), "application/json");
  });

  function downloadFile(filename, content, mime){
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  refresh();
})();
</script>
</body>
</html>
